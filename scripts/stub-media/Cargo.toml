[package]
name = "media"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Patch for Zed media crate: adds Linux cross-compile support"

[lib]
path = "src/media.rs"
doctest = false

[dependencies]
anyhow = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
foreign-types = "0.5"
metal = "0.33"
core-video = { version = "0.5.2", features = ["metal"] }
objc = "0.2"

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.71"