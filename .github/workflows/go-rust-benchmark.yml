name: Go vs Rust terminal benchmark

on:
  push:
    branches: [go-rewrite]
    paths:
      - ".github/workflows/go-rust-benchmark.yml"
      - "internal/gobench/**"
      - "internal/goprotocol/**"
      - "tests/bench_terminal.rs"
      - "internal/goterminal/**"
      - "internal/goserver/**"
      - "internal/goclient/**"
      - "src/terminal/**"
      - "src/control/**"
  workflow_dispatch:
    inputs:
      runs:
        description: Measured runs per implementation
        required: true
        default: "3"
        type: string
      warmups:
        description: Rust benchmark warmup runs
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: terminal-language-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: go.mod
      - name: Select stable Rust
        run: rustup default stable
      - name: Install Rust server shell fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - run: go mod tidy

      - name: Record runner versions
        run: |
          mkdir -p target
          {
            uname -a
            go version
            rustc --version
            cargo --version
          } | tee target/benchmark-environment.log

      - name: Go 64 MB direct/server completion
        env:
          RUNS: ${{ inputs.runs || '3' }}
        run: |
          set -o pipefail
          go test ./internal/gobench             -run '^      - name: Go interaction under output flood
        env:
          RUNS: ${{ inputs.runs || '3' }}
        run: |
          set -o pipefail
          go test ./internal/gobench             -run TestTerminalInteractionPerformanceGate             -count="$RUNS"             -v             2>&1 | tee target/go-terminal-interaction.log

      - name: Rust 64 MB direct/server completion
        if: always()
        env:
          WATER_BENCH: "1"
          WATER_BENCH_WARMUPS: ${{ inputs.warmups || '1' }}
          WATER_BENCH_RUNS: ${{ inputs.runs || '3' }}
          WATER_BENCH_PROGRAM: unused
          WATER_BENCH_COMMAND: "yes WATER_GO_BENCH | head -c 64000000"
        run: |
          set -o pipefail
          cargo test --release --no-default-features             --test bench_terminal bench_completion_parity             -- --ignored --nocapture             2>&1 | tee target/rust-terminal-64mb.log

      - name: Rust interaction under output flood
        if: always()
        env:
          WATER_BENCH: "1"
          WATER_BENCH_WARMUPS: ${{ inputs.warmups || '1' }}
          WATER_BENCH_RUNS: ${{ inputs.runs || '3' }}
        run: |
          set -o pipefail
          cargo test --release --no-default-features             --test bench_terminal bench_interaction_parity             -- --ignored --nocapture             2>&1 | tee target/rust-terminal-interaction.log

      - name: Upload raw benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-rust-terminal-benchmark-${{ github.run_id }}
          path: |
            target/benchmark-environment.log
            target/go-terminal-64mb.log
            target/go-terminal-interaction.log
            target/go-terminal-direct-profile.log
            target/go-terminal-direct-alloc.txt
            target/go-terminal-direct.mem
            target/rust-terminal-64mb.log
            target/rust-terminal-interaction.log
          if-no-files-found: error
             -bench 'BenchmarkTerminal(Direct|Server)64MB      - name: Go interaction under output flood
        env:
          RUNS: ${{ inputs.runs || '3' }}
        run: |
          set -o pipefail
          go test ./internal/gobench             -run TestTerminalInteractionPerformanceGate             -count="$RUNS"             -v             2>&1 | tee target/go-terminal-interaction.log

