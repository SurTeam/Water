name: Sign macOS app

on:
  workflow_dispatch:
    inputs:
      variant:
        description: App variant contained in the unsigned archive
        required: true
        type: choice
        options:
          - release
          - dev
        default: release
      publication:
        description: GitHub release mode after signing
        required: true
        type: choice
        options:
          - draft
          - prerelease
          - release
          - none
        default: release
      tag:
        description: Existing git tag and target release (for example v0.2.9)
        required: true
        type: string
      source_release:
        description: Draft release containing the unsigned archive (normally the same tag)
        required: true
        type: string
      source_asset:
        description: Exact unsigned zip asset name
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-macos-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_VARIANT: ${{ inputs.variant }}
      RELEASE_PUBLICATION: ${{ inputs.publication }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RELEASE: ${{ inputs.source_release }}
      SOURCE_ASSET: ${{ inputs.source_asset }}
      CERTIFICATE_BASE64: ${{ secrets.SURTEAM_CODE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.SURTEAM_SIGN_PASS }}
      SIGNING_IDENTITY_OVERRIDE: ${{ secrets.SURTEAM_SIGNING_IDENTITY }}

    steps:
      - name: Resolve signing inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_VARIANT" in
            release)
              app_name='Water'
              gui_binary='water'
              server_binary='water-server'
              [[ "$RELEASE_TAG" == v* ]] || {
                echo "error: release builds require a v* tag" >&2
                exit 1
              }
              ;;
            dev)
              app_name='Water Dev'
              gui_binary='water-dev'
              server_binary='water-srv-dev'
              [[ "$RELEASE_TAG" == dev-* ]] || {
                echo "error: dev builds require a dev-* tag" >&2
                exit 1
              }
              ;;
            *)
              echo "error: variant must be dev or release" >&2
              exit 1
              ;;
          esac

          case "$RELEASE_PUBLICATION" in
            draft|none) ;;
            prerelease)
              [[ "$TARGET_VARIANT" == dev ]] || {
                echo "error: prerelease is reserved for the dev variant" >&2
                exit 1
              }
              ;;
            release)
              [[ "$TARGET_VARIANT" == release ]] || {
                echo "error: release is reserved for the release variant" >&2
                exit 1
              }
              ;;
            *)
              echo "error: invalid publication mode $RELEASE_PUBLICATION" >&2
              exit 1
              ;;
          esac

          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "error: target tag contains unsupported characters" >&2
            exit 1
          }
          [[ "$SOURCE_RELEASE" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "error: source release contains unsupported characters" >&2
            exit 1
          }
          [[ "$SOURCE_ASSET" != */* ]] || {
            echo "error: source asset must be a filename, not a path" >&2
            exit 1
          }
          case "$SOURCE_ASSET" in
            "$app_name"-*-macOS-arm64.zip) ;;
            *)
              echo "error: source asset does not match the selected app variant" >&2
              exit 1
              ;;
          esac
          version="${SOURCE_ASSET#"$app_name-"}"
          version="${version%-macOS-arm64.zip}"
          [[ -n "$version" && "$version" != "$SOURCE_ASSET" ]] || {
            echo "error: could not determine app version from source asset" >&2
            exit 1
          }

          {
            echo "app_name=$app_name"
            echo "gui_binary=$gui_binary"
            echo "server_binary=$server_binary"
            echo "version=$version"
            echo "title=$app_name $version"
          } >> "$GITHUB_OUTPUT"

      - name: Download unsigned app
        shell: bash
        env:
          APP_NAME: ${{ steps.release.outputs.app_name }}
        run: |
          set -euo pipefail
          unsigned_dir="$RUNNER_TEMP/water-unsigned"
          signing_dir="$RUNNER_TEMP/water-signing"
          mkdir -p "$unsigned_dir" "$signing_dir"
          gh release download "$SOURCE_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ASSET" \
            --dir "$unsigned_dir"
          test -s "$unsigned_dir/$SOURCE_ASSET"
          unzip -q "$unsigned_dir/$SOURCE_ASSET" -d "$signing_dir"
          test -d "$signing_dir/$APP_NAME.app"

      - name: Import SurTeam signing certificate
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CERTIFICATE_BASE64" ]] || {
            echo "error: missing SURTEAM_CODE_P12_BASE64 repository secret" >&2
            exit 1
          }
          [[ -n "$CERTIFICATE_PASSWORD" ]] || {
            echo "error: missing SURTEAM_SIGN_PASS repository secret" >&2
            exit 1
          }

          umask 077
          certificate_path="$RUNNER_TEMP/water-signing.p12"
          keychain_path="$RUNNER_TEMP/water-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "WATER_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "WATER_SIGNING_CERTIFICATE=$certificate_path" >> "$GITHUB_ENV"

          if ! printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path" 2>/dev/null; then
            printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          fi
          test -s "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -k "$keychain_path" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"

          # Do not use `-v` here: it excludes self-signed identities on some
          # macOS runner images even though codesign can use the imported key.
          identity_listing="$(security find-identity -p codesigning "$keychain_path")"
          if [[ -n "$SIGNING_IDENTITY_OVERRIDE" ]]; then
            signing_identity="$SIGNING_IDENTITY_OVERRIDE"
          else
            signing_identity="$(printf '%s\n' "$identity_listing" |
              awk -F '"' '/^[[:space:]]*[0-9]+\)/ { print $2; exit }')"
          fi
          [[ -n "$signing_identity" ]] || {
            echo "error: no Code Signing identity found in SurTeamCode.p12" >&2
            exit 1
          }
          printf '%s\n' "$identity_listing" | grep -Fq "\"$signing_identity\"" || {
            echo "error: selected signing identity is not present in the imported keychain" >&2
            exit 1
          }
          echo "CODESIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Sign app
        shell: bash
        env:
          APP_NAME: ${{ steps.release.outputs.app_name }}
          GUI_BINARY: ${{ steps.release.outputs.gui_binary }}
          SERVER_BINARY: ${{ steps.release.outputs.server_binary }}
        run: |
          set -euo pipefail
          app_dir="$RUNNER_TEMP/water-signing/$APP_NAME.app"
          test -x "$app_dir/Contents/MacOS/$SERVER_BINARY"
          test -x "$app_dir/Contents/MacOS/$GUI_BINARY"

          # Sign nested executables before the containing app bundle.
          codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" \
            "$app_dir/Contents/MacOS/$SERVER_BINARY"
          codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" \
            "$app_dir/Contents/MacOS/$GUI_BINARY"
          codesign --force --options runtime --timestamp --sign "$CODESIGN_IDENTITY" \
            "$app_dir"

      - name: Verify signed app and archive
        shell: bash
        env:
          APP_NAME: ${{ steps.release.outputs.app_name }}
        run: |
          set -euo pipefail
          app_dir="$RUNNER_TEMP/water-signing/$APP_NAME.app"
          signed_asset="$RUNNER_TEMP/$SOURCE_ASSET"
          codesign --verify --deep --strict --verbose=2 "$app_dir"
          codesign --display --verbose=2 "$app_dir" 2>&1
          (cd "$RUNNER_TEMP/water-signing" && zip -r -X -q "$signed_asset" "$APP_NAME.app")
          test -s "$signed_asset"
          unzip -tq "$signed_asset"
          echo "WATER_SIGNED_ASSET=$signed_asset" >> "$GITHUB_ENV"

      - name: Upload signed asset and publish release
        shell: bash
        env:
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$WATER_SIGNED_ASSET" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            create_args=(--title "$RELEASE_TITLE" --generate-notes --verify-tag)
            case "$RELEASE_PUBLICATION" in
              release) create_args+=(--latest) ;;
              prerelease) create_args+=(--prerelease) ;;
              draft|none) create_args+=(--draft) ;;
            esac
            gh release create "$RELEASE_TAG" "$WATER_SIGNED_ASSET" \
              --repo "$GITHUB_REPOSITORY" "${create_args[@]}"
            exit 0
          fi

          case "$RELEASE_PUBLICATION" in
            release)
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$RELEASE_TITLE" --draft=false --prerelease=false --latest
              ;;
            prerelease)
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$RELEASE_TITLE" --draft=false --prerelease
              ;;
            draft)
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$RELEASE_TITLE" --draft
              ;;
            none)
              echo "Signed asset uploaded; release remains unchanged"
              ;;
          esac

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${WATER_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$WATER_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
          fi
          if [[ -n "${WATER_SIGNING_CERTIFICATE:-}" ]]; then
            rm -f -- "$WATER_SIGNING_CERTIFICATE"
          fi
