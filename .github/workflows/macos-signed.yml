name: Signed macOS app

on:
  workflow_dispatch:
    inputs:
      variant:
        description: App variant to build
        required: true
        type: choice
        options:
          - release
          - dev
        default: release
      publication:
        description: GitHub release mode (none only builds and uploads the artifact)
        required: true
        type: choice
        options:
          - draft
          - prerelease
          - release
          - none
        default: draft
      tag:
        description: Optional tag; defaults to vVERSION for release or dev-TIMESTAMP for dev
        required: false
        type: string
  push:
    tags:
      - 'v*'
      - 'dev-*'

permissions:
  contents: write

concurrency:
  group: signed-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_VARIANT: ${{ inputs.variant }}
      INPUT_PUBLICATION: ${{ inputs.publication }}
      INPUT_TAG: ${{ inputs.tag }}
      CERTIFICATE_BASE64: ${{ secrets.SURTEAM_CODE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.SURTEAM_SIGN_PASS }}
      SIGNING_IDENTITY_OVERRIDE: ${{ secrets.SURTEAM_SIGNING_IDENTITY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve build and publication
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            case "$REF_NAME" in
              v*)
                variant=release
                publication=release
                ;;
              dev-*)
                variant=dev
                publication=prerelease
                ;;
              *)
                echo "error: unsupported tag $REF_NAME" >&2
                exit 1
                ;;
            esac
            tag="$REF_NAME"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            variant="$INPUT_VARIANT"
            publication="$INPUT_PUBLICATION"
            tag="$INPUT_TAG"
          else
            echo "error: unsupported event $EVENT_NAME" >&2
            exit 1
          fi

          case "$variant" in
            dev|release) ;;
            *) echo "error: variant must be dev or release" >&2; exit 1 ;;
          esac
          case "$publication" in
            draft|none) ;;
            prerelease)
              [[ "$variant" == dev ]] || {
                echo "error: prerelease is reserved for the dev variant" >&2
                exit 1
              }
              ;;
            release)
              [[ "$variant" == release ]] || {
                echo "error: release is reserved for the release variant" >&2
                exit 1
              }
              ;;
            *) echo "error: invalid publication mode $publication" >&2; exit 1 ;;
          esac

          version="$(awk -F ' *= *' '/^version = / { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          [[ -n "$version" ]] || { echo "error: Cargo.toml version is empty" >&2; exit 1; }
          if [[ -z "$tag" ]]; then
            if [[ "$variant" == release ]]; then
              tag="v$version"
            else
              tag="dev-$(date -u +%Y%m%d-%H%M)"
            fi
          fi
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "error: tag contains unsupported characters" >&2
            exit 1
          }

          if [[ "$variant" == dev ]]; then
            app_name='Water Dev'
          else
            app_name='Water'
          fi
          asset="dist/${app_name}-${version}-macOS-arm64.zip"
          title="${app_name} ${version}"

          {
            echo "variant=$variant"
            echo "publication=$publication"
            echo "tag=$tag"
            echo "version=$version"
            echo "app_name=$app_name"
            echo "asset=$asset"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"

      - name: Install cross-build tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zig >/dev/null 2>&1; then
            brew install zig
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi
          command -v zig
          command -v cargo-zigbuild

      - name: Import SurTeam signing certificate
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CERTIFICATE_BASE64" ]] || {
            echo "error: missing SURTEAM_CODE_P12_BASE64 repository secret" >&2
            exit 1
          }
          [[ -n "$CERTIFICATE_PASSWORD" ]] || {
            echo "error: missing SURTEAM_SIGN_PASS repository secret" >&2
            exit 1
          }

          umask 077
          certificate_path="$RUNNER_TEMP/water-signing.p12"
          keychain_path="$RUNNER_TEMP/water-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          if ! printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path" 2>/dev/null; then
            printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          fi
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -k "$keychain_path" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"

          if [[ -n "$SIGNING_IDENTITY_OVERRIDE" ]]; then
            signing_identity="$SIGNING_IDENTITY_OVERRIDE"
          else
            signing_identity="$(security find-identity -v -p codesigning "$keychain_path" |
              awk -F '"' '/^[[:space:]]*[0-9]+\)/ { print $2; exit }')"
          fi
          [[ -n "$signing_identity" ]] || {
            echo "error: no valid codesigning identity found in SurTeamCode.p12" >&2
            exit 1
          }
          security find-identity -v -p codesigning "$keychain_path" |
            grep -Fq "\"$signing_identity\"" || {
              echo "error: selected signing identity is not valid in the imported keychain" >&2
              exit 1
            }
          echo "Using signing identity: $signing_identity"
          {
            echo "CODESIGN_IDENTITY=$signing_identity"
            echo "CODESIGN_REQUIRED=1"
            echo "WATER_SIGNING_KEYCHAIN=$keychain_path"
            echo "WATER_SIGNING_CERTIFICATE=$certificate_path"
          } >> "$GITHUB_ENV"

      - name: Build signed Water.app
        shell: bash
        env:
          WATER_APP_VARIANT: ${{ steps.release.outputs.variant }}
        run: bash scripts/build-macos-app.sh

      - name: Verify signed bundle and archive
        shell: bash
        env:
          APP_NAME: ${{ steps.release.outputs.app_name }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          app_dir="dist/${APP_NAME}.app"
          test -s "$ASSET"
          codesign --verify --deep --strict --verbose=2 "$app_dir"
          codesign --verify --strict "$app_dir/Contents/MacOS/water" 2>/dev/null ||
            codesign --verify --strict "$app_dir/Contents/MacOS/water-dev"
          codesign --display --verbose=2 "$app_dir" 2>&1
          unzip -l "$ASSET" | grep -Fq "${APP_NAME}.app/"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.app_name }}-${{ steps.release.outputs.version }}-macOS-arm64
          path: ${{ steps.release.outputs.asset }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: steps.release.outputs.publication != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_PUBLICATION: ${{ steps.release.outputs.publication }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          args=(--title "$RELEASE_TITLE" --target "$GITHUB_SHA")
          case "$RELEASE_PUBLICATION" in
            release) args+=(--latest --generate-notes) ;;
            prerelease) args+=(--prerelease --generate-notes) ;;
            draft) args+=(--draft) ;;
            *) echo "error: publication was not resolved" >&2; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" "$ASSET" "${args[@]}"

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${WATER_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$WATER_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
          fi
          rm -f -- "${WATER_SIGNING_CERTIFICATE:-}"
