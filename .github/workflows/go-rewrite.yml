name: go-rewrite

on:
  push:
    branches: [go-rewrite]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/go*/**"
      - "tests/go_server_compat.rs"
      - "tests/scenarios/**"
      - "scripts/run-go-scenario-suite.sh"
      - "scripts/run-go-ui-smoke.sh"
      - "scripts/run-go-rust-ui-smoke.sh"
      - "src/control/**"
      - "src/command/**"
      - "src/terminal/**"
      - ".github/workflows/go-rewrite.yml"

concurrency:
  group: go-rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Install Linux Gio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev libxcursor-dev libxfixes-dev

      - run: go mod tidy
      - name: Build remote payloads
        run: bash scripts/build-go-embedded-servers.sh
      - run: go test ./internal/goprotocol ./internal/goagent ./internal/goconfig ./internal/gohyperlink ./internal/gomodel ./internal/goremote ./internal/goterminal ./internal/goserver ./internal/goclient ./internal/govt ./internal/goui
      - run: go test ./cmd/...
      - run: go vet ./...
      - run: bash -n scripts/build-go-macos-app.sh scripts/build-go-linux.sh scripts/build-go-embedded-servers.sh scripts/run-go-ui-smoke.sh scripts/run-go-rust-ui-smoke.sh scripts/run-rust-go-ui-smoke.sh
      - name: Smoke-build native Linux Go package
        if: runner.os == 'Linux'
        env:
          WATER_APP_VARIANT: dev
          WATER_APP_VERSION: ci
        run: |
          bash scripts/build-go-linux.sh
          test -x "target/go-linux/dev/water-dev/water-dev"
          test -x "target/go-linux/dev/water-dev/water-srv-dev"
          test -s "dist/water-dev-ci-x86_64-linux.tar.gz"

      - name: Smoke-build native macOS Go app bundle
        if: runner.os == 'macOS'
        env:
          WATER_APP_VARIANT: dev
          WATER_APP_VERSION: ci
          CODESIGN_SKIP: "1"
        run: |
          bash scripts/build-go-macos-app.sh
          test -x "dist/Water Dev.app/Contents/MacOS/water-dev"
          test -x "dist/Water Dev.app/Contents/MacOS/water-srv-dev"
          test -s "dist/Water Dev-ci-macOS-arm64.zip"


  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: go.mod
      - name: Select stable Rust
        run: rustup default stable
      - run: go mod tidy
      - name: Build Go server
        run: |
          mkdir -p target/compat
          go build -o target/compat/water-go-server ./cmd/water-server
      - name: Build headless Rust server
        run: cargo build --no-default-features --bin water-server
      - name: Go client to Rust server
        env:
          WATER_RUST_SERVER_BIN: ${{ github.workspace }}/target/debug/water-server
        run: go test ./internal/goclient -run TestGoClientAgainstRustServer -count=1 -v
      - name: Rust client to Go server
        env:
          WATER_GO_SERVER_BIN: ${{ github.workspace }}/target/compat/water-go-server
        run: cargo test --no-default-features --test go_server_compat -- --nocapture


  scenarios:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Install Linux scenario dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh libxkbcommon-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev libxcursor-dev libxfixes-dev

      - name: Ensure zsh fixture path
        run: |
          if [ ! -x /opt/homebrew/bin/zsh ]; then
            sudo mkdir -p /opt/homebrew/bin
            sudo ln -sf /bin/zsh /opt/homebrew/bin/zsh
          fi

      - run: go mod tidy

      - name: Build Go scenario binaries
        run: |
          mkdir -p target/go-scenarios
          go build -o target/go-scenarios/water ./cmd/water
          go build -o target/go-scenarios/water-server ./cmd/water-server

      - name: Run full Go scenario suite
        env:
          WATER_SCENARIO_REQUIRE_ALL: "1"
        run: bash scripts/run-go-scenario-suite.sh


  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: go.mod
      - run: go mod tidy
      - name: Gate terminal throughput and backpressure
        run: go test ./internal/gobench -run 'TestTerminal.*PerformanceGate' -count=1 -v
